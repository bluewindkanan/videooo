<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Videooo Workbench</title>
    <style>
      :root {
        --c-bg: #fafafa;
        --c-surface: #fff;
        --c-border: #e0e0e0;
        --c-text: #1a1a1a;
        --c-muted: #666;
        --c-pending: #9e9e9e;
        --c-running: #1976d2;
        --c-completed: #2e7d32;
        --c-failed: #c62828;
        --c-needs-review: #f57c00;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        margin: 0;
        padding: 24px;
        background: var(--c-bg);
        color: var(--c-text);
        line-height: 1.5;
      }
      a { color: var(--c-running); text-decoration: none; }
      a:hover { text-decoration: underline; }

      .container { max-width: 960px; margin: 0 auto; }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--c-border);
      }
      .header h1 { margin: 0; font-size: 1.4rem; }

      .btn {
        display: inline-block;
        padding: 8px 16px;
        border: 1px solid var(--c-border);
        border-radius: 4px;
        background: var(--c-surface);
        cursor: pointer;
        font-size: 0.875rem;
        font-family: inherit;
        color: var(--c-text);
      }
      .btn:hover { background: #f0f0f0; }
      .btn:focus-visible { outline: 2px solid var(--c-running); outline-offset: 2px; }
      .btn-primary { background: var(--c-running); color: #fff; border-color: var(--c-running); }
      .btn-primary:hover { background: #1565c0; }
      .btn-danger { background: var(--c-failed); color: #fff; border-color: var(--c-failed); }
      .btn-danger:hover { background: #b71c1c; }

      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #fff;
      }
      .badge-pending { background: var(--c-pending); }
      .badge-running { background: var(--c-running); }
      .badge-completed { background: var(--c-completed); }
      .badge-failed { background: var(--c-failed); }
      .badge-needs_review { background: var(--c-needs-review); }
      .badge-critical { background: var(--c-failed); }
      .badge-warning { background: var(--c-needs-review); }
      .badge-info { background: var(--c-running); }

      .card {
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: 6px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .card-clickable { cursor: pointer; transition: box-shadow 0.15s; }
      .card-clickable:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

      .card-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .card-id {
        font-family: ui-monospace, monospace;
        font-weight: 600;
        font-size: 0.875rem;
      }
      .card-summary {
        flex: 1;
        color: var(--c-muted);
        font-size: 0.875rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card-date { font-size: 0.75rem; color: var(--c-muted); }

      .back-link { margin-bottom: 16px; display: inline-block; }

      .steps-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .step-card {
        flex: 1;
        min-width: 160px;
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: 6px;
        padding: 12px;
        text-align: center;
      }
      .step-card .step-key { font-weight: 600; font-size: 0.875rem; margin-bottom: 6px; }
      .step-card .step-error { font-size: 0.75rem; color: var(--c-failed); margin-top: 6px; }

      .info-grid {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 8px 16px;
        font-size: 0.875rem;
      }
      .info-grid .label { color: var(--c-muted); font-weight: 500; }

      .form-group { margin-bottom: 16px; }
      .form-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 4px;
        font-size: 0.875rem;
      }
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--c-border);
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.875rem;
      }
      .form-group textarea { min-height: 80px; resize: vertical; }
      .form-group select:focus,
      .form-group textarea:focus {
        outline: 2px solid var(--c-running);
        outline-offset: 1px;
      }

      .disclaimer {
        margin-top: 32px;
        padding: 12px;
        background: #fff8e1;
        border: 1px solid #ffe082;
        border-radius: 4px;
        font-size: 0.75rem;
        color: #5d4037;
      }

      .section-title {
        font-size: 1rem;
        font-weight: 600;
        margin: 20px 0 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--c-border);
      }

      .script-block { padding: 12px; }
      .script-block .hook { font-weight: 700; margin-bottom: 8px; }
      .script-block .body-text { white-space: pre-wrap; margin-bottom: 8px; }
      .script-block .cta { color: var(--c-running); }

      table.storyboard-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
      }
      table.storyboard-table th,
      table.storyboard-table td {
        border: 1px solid var(--c-border);
        padding: 8px;
        text-align: left;
      }
      table.storyboard-table th { background: #f5f5f5; font-weight: 600; }

      .issue-card {
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: 4px;
        padding: 10px 14px;
        margin-bottom: 8px;
      }
      .issue-card .issue-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .issue-card .issue-location { font-family: ui-monospace, monospace; font-size: 0.8rem; color: var(--c-muted); }
      .issue-card .issue-message { font-size: 0.85rem; }
      .issue-card .issue-fix { font-size: 0.8rem; color: var(--c-completed); margin-top: 4px; }

      .empty-state { text-align: center; padding: 40px 20px; color: var(--c-muted); }

      .video-preview-section {
        margin-top: 20px;
        padding: 16px;
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: 6px;
      }
      .video-preview-section h3 {
        margin: 0 0 12px 0;
        font-size: 1rem;
      }
      .video-player {
        width: 100%;
        max-width: 640px;
        border-radius: 4px;
        background: #000;
      }
      .video-actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .audio-player {
        width: 100%;
        max-width: 640px;
        margin-top: 8px;
      }
      .media-info {
        font-size: 0.8rem;
        color: var(--c-muted);
        margin-top: 4px;
      }

      #app > div { display: none; }
      #app > div.active { display: block; }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="app">
        <!-- Task List Page -->
        <div id="page-list" class="active">
          <div class="header">
            <h1>Videooo 编导工作台</h1>
            <a href="#/new" class="btn btn-primary">创建新任务</a>
          </div>
          <div id="task-list"></div>
        </div>

        <!-- Task Detail Page -->
        <div id="page-detail">
          <div class="header">
            <a href="#/" class="back-link">&larr; 返回列表</a>
            <h1 id="detail-title">任务详情</h1>
          </div>
          <div id="detail-content"></div>
        </div>

        <!-- Create Task Page -->
        <div id="page-new">
          <div class="header">
            <a href="#/" class="back-link">&larr; 返回列表</a>
            <h1>创建新任务</h1>
          </div>
          <div class="card">
            <div class="form-group">
              <label for="new-input-kind">输入类型</label>
              <select id="new-input-kind">
                <option value="topic">topic (主题)</option>
                <option value="draft">draft (文案)</option>
                <option value="article_url">article_url (文章链接)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="new-input-text">输入内容</label>
              <textarea id="new-input-text" placeholder="输入主题/文案/链接..." aria-label="输入内容"></textarea>
            </div>
            <div class="form-group">
              <label for="new-source-links">素材链接 (每行一个)</label>
              <textarea id="new-source-links" placeholder="每行一个素材链接（可留空）" aria-label="素材链接"></textarea>
            </div>
            <button id="new-submit" class="btn btn-primary">提交</button>
            <span id="new-error" style="color:var(--c-failed);margin-left:12px;font-size:0.85rem;"></span>
          </div>
        </div>
      </div>

      <div class="disclaimer">
        素材权利边界：你必须确保对输入素材（链接/上传）拥有使用权；系统不承诺自动版权判断。<br />
        若素材链接下载/解析失败：当前切片会记录失败原因并建议改为上传素材（上传能力可后续补齐）。
      </div>
    </div>

    <script src="/workbench.js"></script>
  </body>
</html>
